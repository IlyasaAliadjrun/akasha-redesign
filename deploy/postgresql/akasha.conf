# /etc/postgresql/17/main/conf.d/akasha.conf
# Sized for a 4 GB server that also runs the website, SeaweedFS and Caddy:
# PostgreSQL gets roughly a quarter of RAM for its own buffers and plans on the
# OS page cache for the rest.

listen_addresses = 'localhost'
max_connections = 50

shared_buffers = 512MB
effective_cache_size = 1536MB
work_mem = 8MB
maintenance_work_mem = 128MB

# SSD storage
random_page_cost = 1.1
effective_io_concurrency = 200

wal_compression = on
checkpoint_completion_target = 0.9

# Continuous WAL archiving for point-in-time recovery (pgBackRest, stanza "akasha").
# Enable only after `pgbackrest --stanza=akasha stanza-create` has succeeded —
# see deploy/SETUP.md §5 — otherwise WAL piles up in pg_wal.
archive_mode = on
archive_command = 'pgbackrest --stanza=akasha archive-push %p'

log_min_duration_statement = 500
log_line_prefix = '%m [%p] %q%u@%d '
