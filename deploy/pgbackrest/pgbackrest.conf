# /etc/pgbackrest.conf
# repo1 lives on this server (fast restore). It is NOT a real backup on its own:
# the same disk failure takes both the database and repo1. Configure repo2 on
# another machine or site before go-live — see deploy/SETUP.md §5.

[global]
repo1-path=/home/data/backups/pgbackrest
repo1-retention-full=2
repo1-retention-diff=7
compress-type=zst
process-max=1
start-fast=y
log-level-console=info
log-level-file=info

# ── Off-site copy (fill in one) ──────────────────────────────────────────────
# SFTP to another server:
# repo2-type=sftp
# repo2-path=/backups/akasha-pgbackrest
# repo2-sftp-host=backup.example.internal
# repo2-sftp-host-user=pgbackrest
# repo2-sftp-private-key-file=/var/lib/postgresql/.ssh/id_ed25519
# repo2-sftp-host-key-hash-type=sha256
# repo2-retention-full=4
#
# or any S3-compatible bucket off this machine:
# repo2-type=s3
# repo2-path=/akasha
# repo2-s3-bucket=CHANGE_ME
# repo2-s3-endpoint=CHANGE_ME
# repo2-s3-region=CHANGE_ME
# repo2-s3-key=CHANGE_ME
# repo2-s3-key-secret=CHANGE_ME
# repo2-retention-full=4

[akasha]
pg1-path=/var/lib/postgresql/17/main
